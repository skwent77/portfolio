<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540"><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#829087" stroke-opacity=".09"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#9aa69b"/></marker></defs><rect x="0" y="0" width="960" height="540" rx="0" fill="#18231e" stroke="none"/><text x="40" y="42" font-size="11" fill="#7e8e85" font-family="monospace" >02 / REASONING IN A LOOP</text><text x="48" y="122" font-size="39" fill="#e8eae0" font-family="Georgia" >Think. Act. Observe.</text><text x="48" y="154" font-size="12" fill="#88988e" font-family="monospace" >An agent learns from its next step.</text><circle cx="720" cy="283" r="141" fill="none" stroke="#566c5b" stroke-width="1" stroke-dasharray="3 7"/><circle cx="720" cy="283" r="90" fill="none" stroke="#3a4b3f"/><rect x="620" y="177" width="150" height="58" rx="3" fill="#26352c" stroke="#5b6a59"/><text x="635" y="199" font-size="10" fill="#8ea98a" font-family="monospace" >01</text><text x="635" y="220" font-size="13" fill="#e2e9d8" font-family="monospace" >REASON</text><rect x="750" y="315" width="150" height="58" rx="3" fill="#26352c" stroke="#5b6a59"/><text x="765" y="337" font-size="10" fill="#8ea98a" font-family="monospace" >02</text><text x="765" y="358" font-size="13" fill="#e2e9d8" font-family="monospace" >ACT</text><rect x="556" y="359" width="150" height="58" rx="3" fill="#26352c" stroke="#5b6a59"/><text x="571" y="381" font-size="10" fill="#8ea98a" font-family="monospace" >03</text><text x="571" y="402" font-size="13" fill="#e2e9d8" font-family="monospace" >OBSERVE</text><rect x="48" y="214" width="410" height="220" rx="4" fill="#1c2520" stroke="#354339"/><text x="68" y="246" font-size="11" fill="#8a9b8b" font-family="monospace" >agent / runtime</text><path d="M67 264L440 264" stroke="#354339" fill="none" /><text x="70" y="301" font-size="12" fill="#9eaf9a" font-family="monospace" >&gt; thought   understand the task</text><text x="70" y="333" font-size="12" fill="#d8e4c8" font-family="monospace" >&gt; action    select a tool</text><text x="70" y="365" font-size="12" fill="#9eaf9a" font-family="monospace" >&gt; observe   read the result</text><text x="70" y="397" font-size="12" fill="#d8e4c8" font-family="monospace" >&gt; repeat    refine the next step</text><text x="48" y="505" font-size="10" fill="#7e8e85" font-family="monospace" >ReAct / TOOL USE / AGENT DESIGN</text><text x="899" y="505" font-size="9" fill="#7e8e85" font-family="monospace" text-anchor="end">CONCEPT DIAGRAM</text></svg>